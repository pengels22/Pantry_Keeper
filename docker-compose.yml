services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantry_keeper
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: change-me
    volumes:
      - pantry_db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://pantry:change-me@db:5432/pantry_keeper
      APP_NAME: Pantry Keeper
      RECEIPT_API_TOKEN: change-this-token
      ENABLE_OCR: "true"
    ports:
      - "8000:8000"

volumes:
  pantry_db:
